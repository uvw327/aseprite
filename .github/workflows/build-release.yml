name: build-release

on:
  workflow_dispatch:
  push:
    branches:
      - build-v1.3.18.6

permissions:
  contents: read

env:
  ASEPRITE_VERSION: 1.3.18.6

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: aseprite/get-ninja@main

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Download Skia
        shell: bash
        run: |
          skia_url=$(source laf/misc/skia-url.sh windows x64 | xargs)
          skia_file=$(basename "$skia_url")
          curl --ssl-revoke-best-effort -L -o "$skia_file" "$skia_url"
          unzip -q "$skia_file" -d skia

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING=ON \
            -DENABLE_CCACHE=OFF \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$(realpath skia)" \
            -DSKIA_LIBRARY_DIR="$(realpath skia/out/Release-x64)"

      - name: Build
        shell: bash
        run: cmake --build build --target aseprite

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/bin/aseprite.exe dist/
          Copy-Item build/bin/data dist/data -Recurse

          # Copy every non-system DLL that the executable (transitively) needs,
          # so the package does not rely on anything preinstalled (OpenSSL, CRT).
          $searchDirs = @(
            (Join-Path $env:VCToolsRedistDir 'x64\Microsoft.VC143.CRT'),
            "$env:ProgramFiles\OpenSSL\bin",
            "$env:ProgramFiles\OpenSSL-Win64\bin"
          ) | Where-Object { $_ -and (Test-Path $_) }

          function Add-DllDependencies([string]$file) {
            $out = dumpbin /dependents $file | Out-String
            foreach ($m in [regex]::Matches($out, '(?im)^\s{2,}([\w\-.]+\.dll)\s*$')) {
              $dll = $m.Groups[1].Value
              if (Test-Path (Join-Path dist $dll)) { continue }
              if (Test-Path (Join-Path $env:SystemRoot "System32\$dll")) { continue }
              $src = $searchDirs |
                ForEach-Object { Join-Path $_ $dll } |
                Where-Object { Test-Path $_ } |
                Select-Object -First 1
              if (-not $src) {
                $src = & where.exe $dll 2>$null | Select-Object -First 1
              }
              if (-not $src) {
                throw "Dependency '$dll' of '$file' could not be located"
              }
              Copy-Item $src (Join-Path dist $dll)
              Write-Host "Bundled $dll <- $src"
              Add-DllDependencies (Join-Path dist $dll)
            }
          }
          Add-DllDependencies (Resolve-Path dist/aseprite.exe)

          Compress-Archive -Path dist/* -DestinationPath "Aseprite-$env:ASEPRITE_VERSION-windows-x64.zip"

      - name: Verify package
        shell: pwsh
        run: |
          dumpbin /dependents build/bin/aseprite.exe
          $bundled = Get-ChildItem dist -Filter *.dll | Select-Object -ExpandProperty Name
          Write-Host ("Bundled DLLs: " + ($bundled -join ", "))
          if ($bundled -notcontains "libcrypto-3-x64.dll") {
            throw "libcrypto-3-x64.dll is not bundled"
          }
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: Aseprite-${{ env.ASEPRITE_VERSION }}-windows-x64
          path: Aseprite-${{ env.ASEPRITE_VERSION }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            min_version: "11.0"
          - os: macos-15-intel
            arch: x64
            min_version: "10.14"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: aseprite/get-ninja@main

      - name: Download Skia
        shell: bash
        run: |
          skia_url=$(source laf/misc/skia-url.sh macos ${{ matrix.arch }} | xargs)
          skia_file=$(basename "$skia_url")
          curl -L -o "$skia_file" "$skia_url"
          unzip -q "$skia_file" -d skia

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.min_version }} \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING=ON \
            -DENABLE_CCACHE=OFF \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$(realpath skia)" \
            -DSKIA_LIBRARY_DIR="$(realpath skia/out/Release-${{ matrix.arch }})"

      - name: Build
        shell: bash
        run: cmake --build build --target aseprite

      - name: Package
        shell: bash
        run: |
          codesign --force --deep --sign - build/bin/Aseprite.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/bin/Aseprite.app \
            "Aseprite-${{ env.ASEPRITE_VERSION }}-macos-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: Aseprite-${{ env.ASEPRITE_VERSION }}-macos-${{ matrix.arch }}
          path: Aseprite-${{ env.ASEPRITE_VERSION }}-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 30
